<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#F59E0B" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Building / Land / Roof Icon Graphics -->
  <g transform="translate(64, 60) scale(0.75)">
    <!-- Roof Silhouette -->
    <path d="M 256 60 L 60 220 L 100 220 L 256 95 L 412 220 L 452 220 Z" fill="url(#goldGrad)" />
    
    <!-- Central Tower -->
    <rect x="180" y="140" width="152" height="270" rx="16" fill="#1E293B" stroke="url(#goldGrad)" stroke-width="12" />
    
    <!-- Left Wing -->
    <rect x="90" y="240" width="80" height="170" rx="12" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="10" />
    
    <!-- Right Wing -->
    <rect x="342" y="240" width="80" height="170" rx="12" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="10" />

    <!-- Windows (Illuminated in Amber) -->
    <rect x="208" y="180" width="36" height="36" rx="6" fill="#FBBF24" />
    <rect x="268" y="180" width="36" height="36" rx="6" fill="#FBBF24" />
    
    <rect x="208" y="240" width="36" height="36" rx="6" fill="#FBBF24" />
    <rect x="268" y="240" width="36" height="36" rx="6" fill="#FBBF24" />
    
    <rect x="208" y="300" width="36" height="36" rx="6" fill="#FBBF24" />
    <rect x="268" y="300" width="36" height="36" rx="6" fill="#FBBF24" />

    <!-- Left Wing Windows -->
    <circle cx="130" cy="285" r="14" fill="#F59E0B" />
    <circle cx="130" cy="345" r="14" fill="#F59E0B" />

    <!-- Right Wing Windows -->
    <circle cx="382" cy="285" r="14" fill="#F59E0B" />
    <circle cx="382" cy="345" r="14" fill="#F59E0B" />

    <!-- Door -->
    <path d="M 232 410 L 232 360 C 232 350 280 350 280 360 L 280 410 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Stylized Text / Monogram -->
  <text x="256" y="445" font-family="'Outfit', sans-serif" font-weight="900" font-size="44" fill="#F59E0B" text-anchor="middle" letter-spacing="4">MALI IMMO</text>
</svg>
